name: Rediff bridge

# Every 10 minutes: copy new Agoda / MakeMyTrip booking emails from Rediffmail
# into Gmail, where the Apps Script picks them up. See bridge/rediff_bridge.py.
# Needs repository secrets REDIFF_USER, REDIFF_PASSWORD, GMAIL_USER,
# GMAIL_APP_PASSWORD; does nothing until they are added.
# Scheduled runs only happen from the repository's default branch.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: rediff-bridge
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bridge
      - name: Copy booking emails Rediff -> Gmail
        working-directory: bridge
        env:
          REDIFF_USER: ${{ secrets.REDIFF_USER }}
          REDIFF_PASSWORD: ${{ secrets.REDIFF_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REDIFF_PROTOCOL: ${{ vars.REDIFF_PROTOCOL }}
          BRIDGE_SENDERS: ${{ vars.BRIDGE_SENDERS }}
        run: python3 rediff_bridge.py
