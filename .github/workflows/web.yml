name: iPhone web app

# Publishes the web version (Add to Home Screen on iPhone) to GitHub Pages:
#   https://<owner>.github.io/<repo>/
# Contains no booking data; each phone connects to your Google Sheet itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Build web app
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
